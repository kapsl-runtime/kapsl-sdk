[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kapsl-vllm-connector"
version = "0.5.0"
description = "Out-of-tree vLLM KV participant connector for Kapsl"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Kapsl contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.scripts]
kapsl-vllm-flash-attn-probe = "kapsl_vllm_connector.flash_attn_probe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
