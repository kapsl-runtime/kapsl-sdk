version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # ort is pinned to an exact release candidate on purpose. Each release
      # ships a different ONNX Runtime and changes the bindings that the CUDA
      # pool allocator and the accelerator provider packs are built against,
      # so upgrade it as planned work with GPU validation, not as a bump PR.
      - dependency-name: "ort"

  - package-ecosystem: cargo
    directory: "/patches/esaxx-rs"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: "/patches/llama-cpp-2"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: "/patches/llama-cpp-sys-2"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
