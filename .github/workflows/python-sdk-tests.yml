name: Python SDK

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Installed wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Rust
        uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository]
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: python-sdk
      - name: Build and install the wheel without optional dependencies
        run: |
          python -m pip install 'maturin==1.12.6' pytest
          maturin build --locked --out dist
          python - <<'PY'
          import os, subprocess, venv
          from pathlib import Path
          venv.create('.venv-native', with_pip=True)
          executable = Path('.venv-native') / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(executable), 'scripts/test-python-wheel.py', '--install-only', '--without-grpc'], check=True)
          PY
      - name: Check generated protocol modules
        if: matrix.python == '3.12' && runner.os == 'Linux'
        run: |
          python -m pip install 'grpcio-tools==1.71.2'
          python scripts/generate-python-grpc.py --check
          python -m pip uninstall -y grpcio-tools
      - name: Build transport test server
        run: cargo build -p kapsl-communication --example python_test_server --locked
      - name: Test the installed wheel against all transports
        run: python scripts/test-python-wheel.py
      - name: Check coexistence with Triton protobuf definitions
        if: matrix.python == '3.12' && runner.os == 'Linux'
        run: |
          python -m pip install 'tritonclient[grpc]==2.72.0'
          python scripts/test-python-wheel.py --triton
