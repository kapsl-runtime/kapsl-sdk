[package]
name = "kapsl-engine-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core API traits and types for the Kapsl inference engine"

[dependencies]
thiserror = "1.0"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1.89"
base64 = "0.22"
kapsl-kv-abi = { version = "0.6.0", path = "../kapsl-kv-abi" }

[dev-dependencies]
bincode = "1.3"
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt"] }
