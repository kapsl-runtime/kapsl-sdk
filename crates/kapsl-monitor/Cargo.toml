[package]
name = "kapsl-monitor"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Prometheus metrics and monitoring for the Kapsl inference engine"

[dependencies]
kapsl-engine-api = { version = "0.3.0", path = "../kapsl-engine-api" }
prometheus = "0.14"
async-trait = "0.1"
futures = "0.3.31"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
