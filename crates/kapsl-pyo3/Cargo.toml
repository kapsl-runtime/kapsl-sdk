[package]
name = "kapsl-pyo3"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for the Kapsl inference engine"
publish = false

[lib]
name = "kapsl_sdk"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
kapsl-ipc = { path = "../kapsl-ipc" }
kapsl-engine-api = { path = "../kapsl-engine-api" }
kapsl-shm = { path = "../kapsl-shm" }
kapsl-transport = { path = "../kapsl-transport" }
tokio = { version = "1", features = ["net", "rt", "sync"] }
