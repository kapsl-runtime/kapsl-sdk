[package]
name = "kapsl-kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Compute kernels for matrix operations and attention in Kapsl"

[package.metadata.cargo-machete]
ignored = ["cc"] # Used by build.rs only (finds the host compiler for nvcc under `cute`).

[dependencies]
kapsl-hal = { version = "0.3.0", path = "../kapsl-hal" }
log = "0.4"
rayon = "1.11.0"
half = { version = "2.0", optional = true }
cudarc = { version = "0.12", features = ["nvrtc", "cublas", "f16"], optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[features]
cuda = ["dep:cudarc", "dep:half", "kapsl-hal/cuda", "kapsl-hal/nvrtc", "kapsl-hal/cublas"]
# Tensor-core attention kernels written with CuTe (CUTLASS), compiled by
# build.rs. Needs nvcc and the third_party/cutlass submodule at build time.
# At run time they are used on sm_80+ GPUs; anything older keeps the `cuda`
# kernels.
cute = ["cuda", "dep:cc"]
rocm = []
