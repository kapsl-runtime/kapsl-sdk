[package]
name = "kapsl-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Compute kernels for matrix operations and attention in Kapsl"

[dependencies]
kapsl-hal = { version = "0.3.0", path = "../kapsl-hal" }
log = "0.4"
rayon = "1.11.0"
half = { version = "2.0", optional = true }
cudarc = { version = "0.12", features = ["nvrtc", "cublas", "f16"], optional = true }

[features]
cuda = ["dep:cudarc", "dep:half", "kapsl-hal/cuda", "kapsl-hal/nvrtc", "kapsl-hal/cublas"]
rocm = []
