[package]
name = "kapsl-communication"
# 0.5.0: kapsl-transport, kapsl-ipc and kapsl-shm now live in this crate.
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Kapsl request transports (TCP, local IPC, shared memory, gRPC) and the server that runs them"

[features]
default = ["hybrid"]
ipc = ["dep:futures", "dep:log", "tokio/full"]
shm = ["dep:shared_memory", "dep:prometheus", "dep:log", "tokio/full"]
hybrid = ["ipc", "shm"]
streaming = ["dep:futures"]
grpc = ["dep:kapsl-grpc"]

[dependencies]
kapsl-engine-api = { version = "0.3.1", path = "../kapsl-engine-api" }
kapsl-grpc = { version = "0.3.0", path = "../kapsl-grpc", optional = true }
async-trait = "0.1"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tokio = { version = "1", features = ["sync", "net", "io-util", "rt", "macros", "time"] }
futures = { version = "0.3", optional = true }
log = { version = "0.4", optional = true }
prometheus = { version = "0.14", optional = true }
shared_memory = { version = "0.12", optional = true }

[dev-dependencies]
kapsl-grpc = { version = "0.3.0", path = "../kapsl-grpc" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde_json = "1"

[[example]]
name = "python_test_server"
required-features = ["hybrid"]
