[package]
name = "kapsl-transport"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Async transport layer for inter-process communication in Kapsl"

[dependencies]
kapsl-engine-api = { version = "0.3.0", path = "../kapsl-engine-api" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tokio = { version = "1", features = ["sync", "net", "io-util", "rt", "macros", "time"] }
bincode = "1.3"
futures = { version = "0.3", optional = true }

[features]
streaming = ["dep:futures"]
