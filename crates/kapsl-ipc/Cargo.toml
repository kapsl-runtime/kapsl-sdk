[package]
name = "kapsl-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Inter-process communication protocol for Kapsl engine clients"

[features]
# Preserve the existing SHM-aware constructors for current consumers. Facade
# users can disable defaults and opt into hybrid support only when required.
default = ["hybrid"]
hybrid = ["dep:kapsl-shm"]
streaming = ["kapsl-transport/streaming"]

[dependencies]
kapsl-engine-api = { version = "0.3.0", path = "../kapsl-engine-api" }
kapsl-scheduler = { version = "0.3.0", path = "../kapsl-scheduler" }
kapsl-transport = { version = "0.3.0", path = "../kapsl-transport" }
kapsl-shm = { version = "0.3.0", path = "../kapsl-shm", optional = true }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
log = "0.4"
