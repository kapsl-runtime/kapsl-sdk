[package]
name = "kapsl-rag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Engine-side RAG storage, ingestion, and connector hosting for Kapsl"

[dependencies]
kapsl-rag-sdk = { version = "0.3.0", path = "../kapsl-rag-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
hnsw_rs = "0.3"
log = "0.4"
toml = "0.8"
wasmtime = { version = "36.0.14", default-features = false, features = ["cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "36.0.14", default-features = false, features = ["preview1"] }
bytes = "1"

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["rt", "macros"] }
