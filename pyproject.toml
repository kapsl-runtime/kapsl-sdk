[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "kapsl-sdk"
version = "0.2.0"
description = "Python SDK for Kapsl inference, native transports, and optional gRPC streaming"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
keywords = ["inference", "llm", "machine-learning", "ai", "python-sdk", "kapsl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
grpc = ["grpcio>=1.71.2,<2", "protobuf>=5.29,<7"]

[project.urls]
Homepage = "https://kapsl.ai"
Repository = "https://github.com/kapsl-runtime/kapsl-sdk"
Issues = "https://github.com/kapsl-runtime/kapsl-sdk/issues"

[tool.maturin]
manifest-path = "crates/kapsl-pyo3/Cargo.toml"
module-name = "kapsl_sdk.kapsl_sdk"
python-source = "crates/kapsl-pyo3"
features = ["pyo3/extension-module"]
include = ["crates/kapsl-pyo3/kapsl_sdk/*.bin", "crates/kapsl-pyo3/kapsl_sdk/py.typed", "patches/**/*", "LICENSE", "NOTICE"]
